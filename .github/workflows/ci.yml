name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP test dependencies
        run: python -m pip install 'flask>=3.0,<4' 'flask-limiter>=3.5,<4' 'requests>=2.31,<3'
      - name: Verify contracts, scoring, and persistence
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q app.py audit.py config.py detector.py scoring.py stylometry.py telemetry.py scripts tests
      - name: Audit capstone evidence and commit history
        run: python scripts/audit_capstone.py
